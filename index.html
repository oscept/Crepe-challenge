<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥞 Crepe Challenge</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#171329;
    color:white;
    overflow:hidden;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
}

.screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(135deg,#24184b,#11101f);
    z-index:20;
    padding:20px;
}

.screen h1{
    font-size:clamp(38px,8vw,75px);
    margin-bottom:15px;
}

.screen p{
    font-size:18px;
    max-width:600px;
    line-height:1.5;
}

button{
    border:none;
    border-radius:15px;
    padding:14px 24px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:#ffbd59;
    color:#25172f;
    margin-top:20px;
    box-shadow:0 5px 0 #b86d22;
}

button:active{
    transform:translateY(4px);
    box-shadow:0 1px 0 #b86d22;
}

#hud{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:12px;
    background:#0d0b18dd;
    z-index:10;
    font-weight:bold;
}

.hudBox{
    background:#28203e;
    padding:8px 14px;
    border-radius:12px;
}

#playArea{
    position:absolute;
    inset:60px 0 0 0;
    display:none;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 30%,#40315f 0 3%,transparent 4%),
        radial-gradient(circle at 70% 60%,#40315f 0 3%,transparent 4%),
        #242039;
}

#message{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    background:#ffffffee;
    color:#24172d;
    padding:12px 20px;
    border-radius:15px;
    font-weight:bold;
    z-index:9;
    display:none;
}

#player{
    position:absolute;
    width:50px;
    height:50px;
    border-radius:50%;
    background:#5b8def;
    border:4px solid white;
    box-shadow:0 0 18px #5b8def;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
}

.item{
    position:absolute;
    font-size:38px;
    width:55px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:15px;
    background:#ffffff18;
    cursor:pointer;
}

#questionBox{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(90%,550px);
    background:#211936;
    border:3px solid #ffbd59;
    border-radius:25px;
    padding:25px;
    z-index:15;
    display:none;
    box-shadow:0 0 30px #0008;
}

#questionBox h2{
    margin-bottom:15px;
}

.answer{
    display:block;
    width:100%;
    margin:10px 0;
    background:#392b57;
    color:white;
    box-shadow:none;
}

.answer:hover{
    background:#554072;
}

#memory{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:12;
    background:#171329;
}

#cards{
    width:min(90%,500px);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:20px;
}

.card{
    aspect-ratio:1;
    border-radius:15px;
    background:#40315f;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    cursor:pointer;
}

.card.open{
    background:#ffbd59;
}

#controls{
    position:absolute;
    bottom:20px;
    right:20px;
    display:grid;
    grid-template-columns:60px 60px 60px;
    gap:5px;
    z-index:11;
}

.control{
    width:60px;
    height:60px;
    margin:0;
    padding:0;
    background:#ffffff22;
    color:white;
    box-shadow:none;
}

.empty{
    visibility:hidden;
}

#result{
    position:absolute;
    inset:0;
    background:#151125ee;
    z-index:30;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
}

#result h2{
    font-size:45px;
    margin-bottom:15px;
}

#result p{
    font-size:20px;
    max-width:500px;
    line-height:1.5;
}

@media(max-width:600px){

    #hud{
        font-size:11px;
    }

    .hudBox{
        padding:6px 8px;
    }

    #controls{
        transform:scale(.8);
        transform-origin:bottom right;
    }
}
</style>
</head>

<body>

<div id="game">

<div id="start" class="screen">
