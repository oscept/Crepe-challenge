<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🥞 Crepe Challenge</title>

<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#151126;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

button{
    font-family:inherit;
    cursor:pointer;
}

/* =========================
   ESTRELLAS CONSTELL
========================= */

.constell{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.constell span{
    position:absolute;
    color:white;
    font-size:20px;
    animation:brillar 2s infinite alternate;
}

.constell span:nth-child(1){
    left:5%;
    top:8%;
}

.constell span:nth-child(2){
    left:18%;
    top:25%;
    animation-delay:.4s;
}

.constell span:nth-child(3){
    left:30%;
    top:10%;
    animation-delay:.8s;
}

.constell span:nth-child(4){
    left:45%;
    top:30%;
    animation-delay:1.2s;
}

.constell span:nth-child(5){
    left:60%;
    top:8%;
    animation-delay:.6s;
}

.constell span:nth-child(6){
    left:75%;
    top:22%;
    animation-delay:1s;
}

.constell span:nth-child(7){
    left:90%;
    top:10%;
    animation-delay:.3s;
}

.constell span:nth-child(8){
    left:12%;
    top:75%;
    animation-delay:1.4s;
}

.constell span:nth-child(9){
    left:35%;
    top:88%;
    animation-delay:.7s;
}

.constell span:nth-child(10){
    left:55%;
    top:75%;
    animation-delay:1.1s;
}

.constell span:nth-child(11){
    left:78%;
    top:85%;
    animation-delay:.2s;
}

.constell span:nth-child(12){
    left:95%;
    top:65%;
    animation-delay:1.5s;
}

@keyframes brillar{

    from{
        opacity:.2;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1.3);
    }
}

/* =========================
   PANTALLAS
========================= */

.screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
    z-index:2;
}

.hidden{
    display:none !important;
}

/* =========================
   INICIO
========================= */

.start-box{
    width:min(600px,95%);
    padding:35px 25px;
    text-align:center;
    background:#251b43;
    border:2px solid #9b6cff;
    border-radius:30px;
    box-shadow:0 0 35px rgba(155,108,255,.3);
}

.student{
    font-size:90px;
    margin-bottom:15px;
    animation:saltar 2s infinite;
}

@keyframes saltar{

    50%{
        transform:translateY(-10px);
    }

}

.start-box h1{
    font-size:clamp(42px,10vw,70px);
    line-height:1;
    margin-bottom:20px;
}

.start-box p{
    font-size:18px;
    line-height:1.5;
    margin-bottom:30px;
}

.play-button{
    background:#8b55ff;
    color:white;
    border:none;
    padding:17px 45px;
    border-radius:50px;
    font-size:23px;
    font-weight:bold;
    box-shadow:0 6px 0 #5932ae;
}

.play-button:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #5932ae;
}

/* =========================
   JUEGO
========================= */

#gameScreen{
    display:none;
    min-height:100vh;
    position:relative;
    z-index:2;
}

/* =========================
   HUD
========================= */

.hud{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:rgba(18,13,35,.96);
    padding:12px;
    z-index:20;
}

.hud-content{
    width:min(900px,95%);
    margin:auto;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;
    flex-wrap:wrap;
}

.hud-item{
    background:#2c2150;
    border:1px solid #7652c6;
    border-radius:15px;
    padding:9px 14px;
    font-size:15px;
}

/* =========================
   MAPA
========================= */

.game-area{
    width:min(900px,95%);
    height:560px;

    margin:95px auto 15px;

    position:relative;
    overflow:hidden;

    border:3px solid #8f6bff;
    border-radius:28px;

    background:
        radial-gradient(circle at 15% 20%,#453477 0 2%,transparent 3%),
        radial-gradient(circle at 70% 30%,#453477 0 2%,transparent 3%),
        radial-gradient(circle at 40% 80%,#453477 0 2%,transparent 3%),
        linear-gradient(135deg,#21183b,#35265b);

    box-shadow:0 0 30px rgba(143,107,255,.25);
}

/* =========================
   PERSONAJE
========================= */

#player{
    position:absolute;

    width:65px;
    height:70px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:50px;

    z-index:10;

    transition:.05s;
}

/* =========================
   INGREDIENTES
========================= */

.ingredient{
    position:absolute;

    width:60px;
    height:60px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:36px;

    border-radius:18px;

    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.4);

    animation:flotar 1.5s infinite alternate;
}

@keyframes flotar{

    to{
        transform:translateY(-8px);
    }

}

.i1{
    left:10%;
    top:18%;
}

.i2{
    left:43%;
    top:30%;
}

.i3{
    left:75%;
    top:18%;
}

.i4{
    left:22%;
    top:65%;
}

.i5{
    left:68%;
    top:68%;
}

/* =========================
   MENSAJE
========================= */

.message{
    position:absolute;

    bottom:15px;
    left:50%;

    transform:translateX(-50%);

    width:90%;

    text-align:center;

    background:rgba(0,0,0,.55);

    padding:10px;

    border-radius:15px;
}

/* =========================
   CONTROLES
========================= */

.controls{
    display:flex;
    justify-content:center;

    position:relative;
    z-index:30;

    margin-bottom:25px;
}

.control-grid{
    display:grid;

    grid-template-columns:65px 65px 65px;
    grid-template-rows:65px 65px;

    gap:8px;
}

.control{
    background:#6744b8;
    color:white;

    border:2px solid #a88bff;

    border-radius:18px;

    font-size:27px;

    touch-action:none;
}

.up{
    grid-column:2;
}

.left{
    grid-column:1;
    grid-row:2;
}

.down{
    grid-column:2;
    grid-row:2;
}

.right{
    grid-column:3;
    grid-row:2;
}

/* =========================
   VENTANAS DE RETOS
========================= */

.modal{
    position:fixed;
    inset:0;

    z-index:50;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:rgba(5,3,12,.94);
}

.modal-box{
    width:min(650px,95%);
    max-height:90vh;
    overflow:auto;

    padding:25px;

    text-align:center;

    background:#271d46;

    border:2px solid #9b6cff;

    border-radius:28px;
}

.modal-box h2{
    font-size:30px;
    margin-bottom:15px;
}

.modal-box p{
    line-height:1.5;
    margin-bottom:15px;
}

/* =========================
   OPCIONES
========================= */

.option{
    width:100%;

    margin:10px 0;

    padding:14px;

    border:none;
    border-radius:15px;

    background:#4d387e;

    color:white;

    font-size:17px;
    font-weight:bold;
}

.option:hover{
    background:#6849a7;
}

/* =========================
   MEMORIA
========================= */

.memory-grid{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:10px;

    max-width:500px;

    margin:20px auto;
}

.card{
    aspect-ratio:1;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:15px;

    background:#6749a4;

    font-size:32px;

    cursor:pointer;
}

.card.hidden-card{
    font-size:0;
}

.card.matched{
    background:#34805d;
}

/* =========================
   FINAL
========================= */

.final-title{
    font-size:clamp(40px,9vw,65px);
    margin-bottom:20px;
}

.final-score{
    font-size:28px;
    margin:20px;
}

.restart-button{
    padding:15px 30px;

    border:none;
    border-radius:20px;

    background:#8b55ff;

    color:white;

    font-size:18px;
    font-weight:bold;
}

/* =========================
   CELULAR
========================= */

@media(max-width:600px){

    .game-area{
        height:470px;
        max-height:65vh;
        margin-top:90px;
    }

    .hud-content{
        justify-content:center;
    }

    .hud-item{
        font-size:13px;
        padding:7px 10px;
    }

    .student{
        font-size:75px;
    }

    .memory-grid{
        gap:7px;
    }

    .card{
        font-size:25px;
    }

}

</style>
</head>

<body>

<!-- =========================
     CONSTELL
========================= -->

<div class="constell">

    <span>✦</span>
    <span>✧</span>
    <span>★</span>
    <span>✦</span>
    <span>✧</span>
    <span>★</span>
    <span>✦</span>
    <span>✧</span>
    <span>★</span>
    <span>✦</span>
    <span>✧</span>
    <span>★</span>

</div>


<!-- =========================
     PANTALLA DE INICIO
========================= -->

<section id="startScreen" class="screen">

    <div class="start-box">

        <div class="student">
            🧑‍🎓
        </div>

        <h1>
            🥞<br>
            CREPE<br>
            CHALLENGE
        </h1>

        <p>
            🎮 Supera los retos, recoge ingredientes,
            aprende y conviértete en el Maestro de los Crepes.
        </p>

        <button
            class="play-button"
            onclick="startGame()">

            ▶️ JUGAR

        </button>

    </div>

</section>


<!-- =========================
     PANTALLA DEL JUEGO
========================= -->

<section id="gameScreen">

    <!-- HUD -->

    <div class="hud">

        <div class="hud-content">

            <div class="hud-item">
                ⭐ Puntos:
                <span id="score">0</span>
            </div>

            <div class="hud-item">
                ❤️ Vidas:
                <span id="lives">3</span>
            </div>

            <div class="hud-item">
                🎯 Nivel:
                <span id="level">1</span>
            </div>

        </div>

    </div>


    <!-- MAPA -->

    <div
        class="game-area"
        id="gameArea">

        <div id="player">
            🧑‍🎓
        </div>


        <!-- INGREDIENTES -->

        <div
            class="ingredient i1"
            data-name="harina">

            🌾

        </div>

        <div
            class="ingredient i2"
            data-name="leche">

            🥛

        </div>

        <div
            class="ingredient i3"
            data-name="huevo">

            🥚

        </div>

        <div
            class="ingredient i4"
            data-name="fresa">

            🍓

        </div>

        <div
            class="ingredient i5"
            data-name="platano">

            🍌

        </div>


        <div class="message">

            🎮 Muévete y recoge los ingredientes.

        </div>

    </div>


    <!-- CONTROLES -->

    <div class="controls">

        <div class="control-grid">

            <button
                class="control up"
                onclick="move('up')">

                ⬆️

            </button>


            <button
                class="control left"
                onclick="move('left')">

                ⬅️

            </button>


            <button
                class="control down"
                onclick="move('down')">

                ⬇️

            </button>


            <button
                class="control right"
                onclick="move('right')">

                ➡️

            </button>

        </div>

    </div>

</section>


<!-- =========================
     MODAL
========================= -->

<div
    id="modal"
    class="modal hidden">

    <div
        id="modalContent"
        class="modal-box">
    </div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let score = 0;

let lives = 3;

let level = 1;

let playerX = 5;

let playerY = 5;

let ingredientsCollected = 0;

let currentQuestion = 0;
let questionNumber = 0;
let questionShowing = false;

let memoryFirst = null;

let memorySecond = null;

let memoryLock = false;

let memoryMatches = 0;


const player =
    document.getElementById("player");


/* =========================
   INICIAR
========================= */

function startGame(){

    document
        .getElementById("startScreen")
        .style.display = "none";

    document
        .getElementById("gameScreen")
        .style.display = "block";


    score = 0;

    lives = 3;

    level = 1;

    playerX = 5;

    playerY = 5;

    ingredientsCollected = 0;
    questionNumber = 0;
    questionShowing = false;
    memoryFirst = null;
    memorySecond = null;
    memoryLock = false;
    memoryMatches = 0;


    document
        .querySelectorAll(".ingredient")
        .forEach(function(item){

            item.style.display = "flex";

            item.dataset.collected = "false";

        });


    updateHUD();

    positionPlayer();

}


/* =========================
   ACTUALIZAR HUD
========================= */

function updateHUD(){

    document
        .getElementById("score")
        .textContent = score;


    document
        .getElementById("lives")
        .textContent = lives;


    document
        .getElementById("level")
        .textContent = level;

}


/* =========================
   POSICIÓN
========================= */

function positionPlayer(){

    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

}


/* =========================
   MOVIMIENTO
========================= */

function move(direction){

    const speed = 4;


    if(direction === "up"){

        playerY -= speed;

    }


    if(direction === "down"){

        playerY += speed;

    }


    if(direction === "left"){

        playerX -= speed;

    }


    if(direction === "right"){

        playerX += speed;

    }


    playerX =
        Math.max(
            1,
            Math.min(94,playerX)
        );


    playerY =
        Math.max(
            1,
            Math.min(82,playerY)
        );


    positionPlayer();

    checkIngredients();

}


/* =========================
   TECLADO
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "ArrowUp" ||
            event.key.toLowerCase() === "w"
        ){

            move("up");

        }


        if(
            event.key === "ArrowDown" ||
            event.key.toLowerCase() === "s"
        ){

            move("down");

        }


        if(
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ){

            move("left");

        }


        if(
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ){

            move("right");

        }

    }
);


/* =========================
   RECOGER INGREDIENTES
========================= */

function checkIngredients(){

    if(questionShowing){
        return;
    }

    const ingredients = document.querySelectorAll(".ingredient");
    const playerRect = player.getBoundingClientRect();

    ingredients.forEach(function(item){

        if(item.dataset.collected === "true"){
            return;
        }

        const itemRect = item.getBoundingClientRect();

        const collision =
            playerRect.left < itemRect.right &&
            playerRect.right > itemRect.left &&
            playerRect.top < itemRect.bottom &&
            playerRect.bottom > itemRect.top;

        if(collision && !questionShowing){

            item.dataset.collected = "true";
            item.style.display = "none";
            score += 10;
            ingredientsCollected++;
            updateHUD();

            questionShowing = true;

            // Cada ingrediente activa un reto.
            setTimeout(function(){
                showQuestion();
            }, 250);
        }
    });
}



/* =========================
   PREGUNTAS
========================= */

const questions = [

    {
        question:
        "¿Cuál de estos ingredientes ayuda a formar la masa del crepe?",

        options:[
            "🌾 Harina",
            "🍓 Fresa",
            "🍫 Chocolate"
        ],

        answer:0
    },


    {
        question:
        "¿Cuál de estos alimentos es una fruta?",

        options:[
            "🥚 Huevo",
            "🍓 Fresa",
            "🌾 Harina"
        ],

        answer:1
    },


    {
        question:
        "¿Qué ingrediente aporta una textura líquida a la mezcla?",

        options:[
            "🥛 Leche",
            "🍌 Plátano",
            "🍓 Fresa"
        ],

        answer:0
    }

];


/* =========================
   MOSTRAR PREGUNTA
========================= */

function showQuestion(){

    currentQuestion = questionNumber % questions.length;
    questionNumber++;


    const question =
        questions[currentQuestion];


    let html = "";


    html += `
        <h2>
            📚 Reto educativo
        </h2>
    `;


    html += `
        <p>
            ${question.question}
        </p>
    `;


    question.options.forEach(
        function(option,index){

            html += `

                <button
                    class="option"
                    onclick="answerQuestion(${index})">

                    ${option}

                </button>

            `;

        }
    );


    document
        .getElementById("modalContent")
        .innerHTML = html;


    document
        .getElementById("modal")
        .classList.remove("hidden");

}


/* =========================
   RESPONDER PREGUNTA
========================= */

function answerQuestion(answer){

    const question = questions[currentQuestion];

    if(answer === question.answer){

        score += 30;
        alert("🎉 ¡Correcto! +30 puntos");

    }else{

        lives--;
        alert("😅 No es correcto. Perdiste una vida.");

        if(lives <= 0){
            questionShowing = false;
            gameOver();
            return;
        }
    }

    updateHUD();
    closeModal();
    questionShowing = false;

    // Cuando ya se recogieron los 5 ingredientes y se respondió
    // el último reto, pasamos al juego de memoria.
    if(ingredientsCollected >= 5){

        level = 2;
        updateHUD();

        setTimeout(function(){
            startMemory();
        }, 350);

    }
}



/* =========================
   JUEGO DE MEMORIA
========================= */

function startMemory(){

    const emojis = [

        "🌾","🌾",
        "🥛","🥛",
        "🥚","🥚",
        "🍓","🍓"

    ];


    emojis.sort(
        function(){

            return Math.random() - .5;

        }
    );


    let html = "";


    html += `
        <h2>
            🧠 Juego de memoria
        </h2>
    `;


    html += `
        <p>
            Encuentra las parejas de ingredientes.
        </p>
    `;


    html += `
        <div class="memory-grid">
    `;


    emojis.forEach(
        function(emoji,index){

            html += `

                <div
                    class="card hidden-card"
                    data-value="${emoji}"
                    data-index="${index}"
                    onclick="flipCard(this)">

                    ${emoji}

                </div>

            `;

        }
    );


    html += `
        </div>
    `;


    document
        .getElementById("modalContent")
        .innerHTML = html;


    document
        .getElementById("modal")
        .classList.remove("hidden");


    memoryFirst = null;

    memorySecond = null;

    memoryLock = false;

    memoryMatches = 0;

}


/* =========================
   VOLTEAR CARTA
========================= */

function flipCard(card){

    if(memoryLock || card.classList.contains("matched")){
        return;
    }

    if(!card.classList.contains("hidden-card")){
        return;
    }

    card.classList.remove("hidden-card");

    if(!memoryFirst){
        memoryFirst = card;
        return;
    }

    memorySecond = card;
    memoryLock = true;

    if(memoryFirst.dataset.value === memorySecond.dataset.value){

        memoryFirst.classList.add("matched");
        memorySecond.classList.add("matched");

        memoryMatches++;
        score += 20;
        updateHUD();

        memoryFirst = null;
        memorySecond = null;
        memoryLock = false;

        if(memoryMatches >= 4){
            setTimeout(function(){
                closeModal();
                level = 3;
                updateHUD();
                showFinal();
            }, 700);
        }

    }else{

        setTimeout(function(){

            memoryFirst.classList.add("hidden-card");
            memorySecond.classList.add("hidden-card");

            memoryFirst = null;
            memorySecond = null;
            memoryLock = false;

        }, 800);

    }

}


/* =========================
   CERRAR MODAL
========================= */

function closeModal(){

    document.getElementById("modal").classList.add("hidden");

}


/* =========================
   FINAL
========================= */

function showFinal(){

    document.getElementById("modalContent").innerHTML = `
        <h2 class="final-title">🏆 ¡Felicidades!</h2>
        <p>Terminaste todos los retos y te convertiste en Maestro de los Crepes. 🥞</p>
        <div class="final-score">
            ⭐ Puntaje final: <strong>${score}</strong>
        </div>
        <button class="restart-button" onclick="restartGame()">
            🔄 JUGAR DE NUEVO
        </button>
    `;

    document.getElementById("modal").classList.remove("hidden");

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    document.getElementById("modalContent").innerHTML = `
        <h2>💔 Fin del juego</h2>
        <p>Te quedaste sin vidas. ¡Inténtalo otra vez!</p>
        <div class="final-score">
            ⭐ Puntaje: <strong>${score}</strong>
        </div>
        <button class="restart-button" onclick="restartGame()">
            🔄 INTENTAR DE NUEVO
        </button>
    `;

    document.getElementById("modal").classList.remove("hidden");

}


/* =========================
   REINICIAR
========================= */

function restartGame(){

    closeModal();

    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("startScreen").style.display = "flex";

}


/* =========================
   CERRAR MODAL AL TOCAR FUERA
========================= */

document.getElementById("modal").addEventListener("click", function(event){

    if(event.target === this){
        closeModal();
    }

});

</script>

</body>
</html>
